document.addEventListener('selectionchange',()=>{
  if(ED.hidden) return; const s=getSelection(); if(!s.rangeCount) return; const r=s.getRangeAt(0);
  const n=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement; const ed=n?.closest?.('.rich');
  if(ed&&ED.contains(ed)){ lastRich=ed; lastRange=r.cloneRange(); }
});
function insertHTMLAt(ed,html){
  ed.focus(); const s=getSelection();
  if(lastRange&&ed.contains(lastRange.startContainer)){ s.removeAllRanges(); s.addRange(lastRange); }
  else{ const r=document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
  document.execCommand('insertHTML',false,html);
}
async function compressImage(file){
  const bmp=await createImageBitmap(file); const max=1600; const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h);
  let b=await new Promise(r=>c.toBlob(r,'image/png'));
  if(b.size>350*1024) b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
  return b;
}
async function storeImage(file){
  const b=await compressImage(file); const name=`${uid()}.${b.type==='image/png'?'png':'jpg'}`;
  await store.writeImage(name,b); imgCache.set(name,URL.createObjectURL(b)); return name;
}
const imgTag=n=>`<img data-img="${n}" src="${imgCache.get(n)}">`;
async function insertImages(ed,files){
  for(const f of files){ try{ const n=await storeImage(f); insertHTMLAt(ed,imgTag(n)); }catch(e){ alert('图片无法读取：'+(f.name||'')+'\n'+e.message); } }
}
ED.addEventListener('paste',async e=>{
  const ed=e.target.closest?.('.rich'); if(!ed) return; const cd=e.clipboardData; if(!cd) return;
  const files=[...cd.files].filter(f=>f.type.startsWith('image/')); const html=cd.getData('text/html'), text=cd.getData('text/plain');

    return;
  }
  if(/^https?:\/\/\S+$/.test(text.trim())){ insertHTMLAt(ed,`<a href="${esc(text.trim())}">${esc(text.trim())}</a>`); return; }
  document.execCommand('insertText',false,text);
});
ED.addEventListener('mousedown',e=>{ if(e.target.closest('#rtb button')||e.target.closest('.ac-item')) e.preventDefault(); });
function wrapSelection(ed,tag,cls){
  const s=getSelection(); if(!s.rangeCount||s.isCollapsed) return false;
  const r=s.getRangeAt(0); if(!ed.contains(r.commonAncestorContainer)) return false;
  const el=document.createElement(tag); if(cls) el.className=cls;
  try{ el.appendChild(r.extractContents()); el.querySelectorAll('u.blank').forEach(unwrap); r.insertNode(el); }catch(err){ return false; }
  s.removeAllRanges(); const nr=document.createRange(); nr.setStartAfter(el); nr.collapse(true); s.addRange(nr); return true;
}
function runCmd(cmd){
  const ed=lastRich&&lastRich.isConnected?lastRich:null;
  if(cmd==='sym'){ const p=$('#symPop'); p.hidden=!p.hidden; return; }
  if(!ed){ toast('请先点一下要编辑的输入框'); return; }
  const restore=()=>{ ed.focus(); if(lastRange&&ed.contains(lastRange.startContainer)){ const s=getSelection(); s.removeAllRanges(); s.addRange(lastRange); } };
  switch(cmd){
    case 'bold': restore(); document.execCommand('bold'); break;
    case 'underline': restore(); document.execCommand('underline'); break;
    case 'sup': restore(); document.execCommand('superscript'); break;
    case 'sub': restore(); document.execCommand('subscript'); break;
    case 'clear': { restore(); const s=getSelection(); if(s.rangeCount){ const r=s.getRangeAt(0); const n=r.commonAncestorContainer; const b=(n.nodeType===1?n:n.parentElement).closest('u.blank,mark'); if(b&&ed.contains(b)){ unwrap(b); break; } } document.execCommand('removeFormat'); break; }
    case 'em': { restore(); if(!wrapSelection(ed,'span','em-dot')) toast('先选中要加着重号的文字'); break; }
    case 'mark': { restore(); if(!wrapSelection(ed,'mark')) toast('先选中要高亮的文字'); break; }
    case 'blank': { restore(); if(!wrapSelection(ed,'u','blank')) toast('先选中作为答案的文字，再点“挖空”'); break; }
    case 'miss': { restore(); const s=getSelection(); const n=s.rangeCount?s.getRangeAt(0).startContainer:null; const b=n&&(n.nodeType===1?n:n.parentElement).closest('u.blank');
      if(!b||!ed.contains(b)){ toast('把光标放进一个已挖空的答案里，再点“答错”'); return; } b.classList.toggle('miss'); if(editorMode==='q'){ syncDraft(); autoLevel(); } break; }
    case 'link': { const s=getSelection(); const txt=lastRange?String(lastRange):''; const url=prompt('链接地址（以 http 开头）：','https://'); if(!url||!/^https?:\/\/./.test(url)) return;
      insertHTMLAt(ed,`<a href="${esc(url)}">${esc(txt||url)}</a>`); break; }
    case 'table': {
      const v=prompt('插入表格：行数 × 列数（例如 3x4）','3x3'); if(!v) return; const m=v.match(/(\d+)\s*[x×*,， ]\s*(\d+)/i); if(!m){ alert('格式示例：3x4'); return; }
      const r=Math.min(30,+m[1]),c=Math.min(12,+m[2]); insertHTMLAt(ed,`<table><tbody>${Array.from({length:r},()=>`<tr>${'<td>&nbsp;</td>'.repeat(c)}</tr>`).join('')}</tbody></table><br>`); break; }
    case 'img': { const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.multiple=true; i.onchange=()=>insertImages(ed,[...i.files]); i.click(); break; }
  }
}
ED.addEventListener('click',async e=>{
  if(e.target.closest('.rich a')){ e.preventDefault(); return; }
  const sym=e.target.closest('[data-sym]'); if(sym){ const ed=lastRich&&lastRich.isConnected?lastRich:null; if(!ed){ toast('请先点一下要编辑的输入框'); return; } const [,h,w]=SYMS[+sym.dataset.sym]; insertHTMLAt(ed,w?h+'​':h); return; }
  const cb=e.target.closest('[data-cmd]'); if(cb){ if(cb.dataset.cmd!=='sym') $('#symPop').hidden=true; runCmd(cb.dataset.cmd); return; }
  if(!e.target.closest('#symPop')) { const p=$('#symPop'); if(p) p.hidden=true; }

    case 'grade': d.grade=a.dataset.v; $$('#gradeSeg button',ED).forEach(b=>b.classList.toggle('on',b===a)); break;
    case 'level': { levelTouched=true; d.level=+a.dataset.v; d.coef=bank.settings.coef[d.level]; d.levelUnset=false; $('#edCoef').value=d.coef; $$('#lvSeg button',ED).forEach(b=>b.classList.toggle('on',b===a)); a.closest('.lvrow').querySelector('.hint')?.remove(); break; }
    case 'key': case 'wrong': {
      const v=a.dataset.v, f=act;
      if(act==='wrong'||d.type==='multi') d[f]=d[f].includes(v)?d[f].replace(v,''):[...(d[f]+v)].sort().join('');
      else d.key=d.key===v?'':v;
      $$(act==='key'?'#keySeg button':'#wrongSeg button',ED).forEach(b=>b.classList.toggle('on',d[f].includes(b.dataset.v))); if(act==='wrong') autoLevel(); break; }
    case 'jkey': { const j=d.judges[+a.dataset.i]; j.key=j.key===a.dataset.v?'':a.dataset.v; a.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===j.key)); break; }
    case 'jmiss': { const j=d.judges[+a.dataset.i]; j.miss=!j.miss; a.classList.toggle('on',j.miss); autoLevel(); break; }
    case 'jadd': syncDraft(); d.judges.push({text:'',key:'',miss:false}); renderEdDyn(); $$('[data-jt]',ED).pop()?.focus(); break;
    case 'jdel': { syncDraft(); if(d.judges.length<=1){ toast('至少保留一条判断'); return; } d.judges.splice(+a.dataset.i,1); renderEdDyn(); break; }
    case 'optadd': syncDraft(); d.options.push(''); renderEdDyn(); $$('[data-opt]',ED).pop()?.focus(); break;
    case 'optdel': {
      syncDraft(); const i=+a.dataset.i; if(d.options.length<=2){ toast('至少保留两个选项'); return; }
      const shift=s=>[...s].map(l=>LETTERS.indexOf(l)).filter(x=>x!==i).map(x=>x>i?x-1:x).sort().map(x=>LETTERS[x]).join('');
      d.options.splice(i,1); d.key=shift(d.key); d.wrong=shift(d.wrong); renderEdDyn(); break; }
    case 'subadd': syncDraft(); d.subs.push({stem:'',answer:'',analysis:'',score:bank.settings.score.sub}); renderEdDyn(); $$('[data-sf="stem"]',ED).pop()?.focus(); break;
    case 'subdel': {
      syncDraft(); const i=+a.dataset.i; const s=d.subs[i];
      if((hasContent(s.stem)||hasContent(s.answer)||hasContent(s.analysis))&&!(await choose('删除小问',`确定删除第 (${i+1}) 小问吗？`,[{label:'取消',value:false},{label:'删除',value:true,danger:true}]))) return;

    case 'subup': case 'subdown': { syncDraft(); const i=+a.dataset.i, j=act==='subup'?i-1:i+1; if(j<0||j>=d.subs.length) return; [d.subs[i],d.subs[j]]=[d.subs[j],d.subs[i]]; renderEdDyn(); break; }

    case 'borrow': { const id=a.dataset.id; if(!d.tags.includes(id)) d.tags.push(id); renderEdTags(); $('#borrowQuery').focus(); break; }
  }
});
